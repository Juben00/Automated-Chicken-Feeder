<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Panel{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body { background: #f4f6fa; }
        .admin-navbar { background: #343a40; }
        .admin-navbar .navbar-brand { color: #fff; font-weight: bold; }
        .admin-navbar .nav-link { color: #fff !important; }
        .admin-navbar .nav-link.active, .admin-navbar .nav-link:focus { color: #ffc107 !important; }
        .admin-card { border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.07); }
        .main-title-gradient { background: linear-gradient(90deg, #007bff, #00c6ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .table thead th { background: #e9ecef; }
        .btn-primary, .btn-outline-primary { border-radius: 20px; }
        .btn-primary { background: linear-gradient(90deg, #007bff, #00c6ff); border: none; }
        .btn-outline-primary { border: 1px solid #007bff; color: #007bff; }
        .btn-outline-primary:hover { background: #007bff; color: #fff; }
        .card-header { background: #f8f9fa; font-weight: 500; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg admin-navbar">
        <div class="container">
            <div class="d-flex align-items-center gap-2">
                <img src="{{ url_for('static', filename='img/chicken-logo.png') }}" alt="Logo" style="width:40px;height:40px;" >
                    <a class="navbar-brand" href="{{ url_for('admin.dashboard') }}">Chicken Feeder</a>
            </div>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('admin.dashboard') }}">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a href="{{ url_for('admin_feed_ratio') }}" class="nav-link"> Feed-to-Gram Ratio
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('admin_user_dashboard') }}">User Accounts</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    
    <main class="container-fluid align-items-center">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                <div class="alert alert-{{ 'success' if category in ['success', 'ok'] else 'danger' }} alert-dismissible fade show" role="alert"
                        style="position: fixed; top: 70px; left: 50%; transform: translateX(-50%); z-index: 9999; min-width: 300px; max-width: 600px;">
                    <i class="fas fa-{{ 'check-circle' if category in ['success', 'ok'] else 'exclamation-circle' }} me-2"></i>
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
